# Kustomize agrupa los manifiestos y permite que el pipeline fije el tag de la
# imagen sin editar los YAML a mano:
#
#   kubectl kustomize deploy/k8s/                 # revisar lo que se aplicará
#   kubectl apply -k deploy/k8s/                  # aplicar
#   kustomize edit set image sistema-arriendo=registro/sistema-arriendo:<sha>
#
# Nunca `kubectl edit` sobre el clúster: lo que no está en este repo no existe.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arriendos

resources:
  - namespace.yaml
  - configuracion.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# `labels` reemplaza a `commonLabels`, deprecado en Kustomize 5. Con
# `includeSelectors: false` las etiquetas van a los objetos pero NO a los
# selectores de Deployment y Service, que son inmutables y deben depender solo
# de `app` y `componente`.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: sistema-arriendo
      app.kubernetes.io/managed-by: kustomize

images:
  - name: sistema-arriendo
    newTag: REEMPLAZAR_POR_SHA
